services:

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
      target: dev
    ports:
      - "8080:8080"
    environment:
      JWT_SECRET: ${JWT_SECRET}
      USER_SERVICE_URL: http://user-service:8081
      CATALOG_SERVICE_URL: http://catalog-service:8082
      ORDER_SERVICE_URL: http://order-service:8083
      INVENTORY_SERVICE_URL: http://inventory-service:8084
      PAYMENT_SERVICE_URL: http://payment-service:8085
    volumes:
      - ./gateway:/app                     # mount source for hot reload
    restart: "no"
    depends_on:
      user-service:
        condition: service_healthy
      order-service:
        condition: service_healthy

  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
      target: dev
    environment:
      PORT: 8081
      DATABASE_URL: postgres://postgres:${USER_DB_PASSWORD}@user-db:5432/userdb?sslmode=disable
      JWT_SECRET: ${JWT_SECRET}
    volumes:
      - ./user-service:/app
    restart: "no"
    depends_on:
      user-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  user-db:
    image: postgres:18.3-alpine3.23
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${USER_DB_PASSWORD}
      POSTGRES_DB: userdb
    volumes:
      - user_db_data:/var/lib/postgresql/data
      - ./user-service/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d userdb"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  order-service:
    build:
      context: ./order-service
      dockerfile: Dockerfile
      target: dev
    environment:
      PORT: 8083
      DATABASE_URL: postgres://postgres:${ORDER_DB_PASSWORD}@order-db:5432/orderdb?sslmode=disable
      REDIS_URL: ${REDIS_URL}
      RABBITMQ_URL: ${RABBITMQ_URL}
    volumes:
      - ./order-service:/app
    restart: "no"
    depends_on:
      order-db:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  order-db:
    image: postgres:18.3-alpine3.23
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${ORDER_DB_PASSWORD}
      POSTGRES_DB: orderdb
    volumes:
      - order_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d orderdb"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7.4-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4.0-management-alpine
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 10s
      retries: 5

volumes:
  user_db_data:
  order_db_data:
