services:
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
      target: dev
    ports:
      - "8080:8080"
    environment:
      JWT_SECRET: ${JWT_SECRET}
      USER_SERVICE_URL: http://user-service:8081
      CATALOG_SERVICE_URL: http://catalog-service:8082
      ORDER_SERVICE_URL: http://order-service:8083
      INVENTORY_SERVICE_URL: http://inventory-service:8084
      PAYMENT_SERVICE_URL: http://payment-service:8085
    volumes:
      - ./gateway:/app # mount source for hot reload
    restart: "no"
    depends_on:
      user-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
    networks:
      - gateway-network

  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
      target: dev
    environment:
      PORT: 8081
      DATABASE_URL: postgres://postgres:${USER_DB_PASSWORD}@user-db:5432/userdb?sslmode=disable
      JWT_SECRET: ${JWT_SECRET}
    volumes:
      - ./user-service:/app
    restart: "no"
    depends_on:
      user-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  user-db:
    image: postgres:18.3-alpine3.23
    ports:
      - "5433:5432" # Expose for DBeaver access
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${USER_DB_PASSWORD}
      POSTGRES_DB: userdb
    volumes:
      - user_db_data:/var/lib/postgresql
      - ./user-service/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d userdb"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  order-service:
    build:
      context: ./order-service
      dockerfile: Dockerfile
      target: dev
    container_name: hong_commerce_order_service
    ports:
      - "8083:8083" # Expose for direct Swagger UI access (http://localhost:8083/swagger/index.html)
    environment:
      PORT: ${ORDER_SERVICE_PORT}
      ORDER_DB_HOST: order-db
      ORDER_DB_PORT: 5432 # Internal container port is 5432, do not change!
      ORDER_DB_USER: ${ORDER_DB_USER}
      ORDER_DB_PASSWORD: ${ORDER_DB_PASSWORD}
      ORDER_DB_NAME: ${ORDER_DB_NAME}
      ORDER_DB_SSLMODE: ${ORDER_DB_SSLMODE}
      MQ_URL: amqp://${MQ_USER:-guest}:${MQ_PASSWORD:-guest}@rabbitmq:5672/${MQ_VHOST:-}
      ORDER_TIMEOUT_MINUTES: ${ORDER_TIMEOUT_MINUTES}
    volumes:
      - ./order-service:/app
    restart: "no"
    depends_on:
      order-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:${ORDER_SERVICE_PORT}/health || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - order-network

  order-db:
    image: postgres:18.3-alpine3.23
    ports:
      - "${ORDER_DB_PORT}:5432" # Expose dynamically using port from .env (e.g. 5434) for DBeaver
    environment:
      POSTGRES_USER: ${ORDER_DB_USER}
      POSTGRES_PASSWORD: ${ORDER_DB_PASSWORD}
      POSTGRES_DB: ${ORDER_DB_NAME}
    volumes:
      - order_db_data:/var/lib/postgresql
      - ./order-service/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d orderdb"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - order-network

  payment-service:
    build:
      context: ./payment-service
      dockerfile: Dockerfile
      target: dev
    container_name: payment-service
    ports:
      - "${PAYMENT_SERVICE_PORT}:${PAYMENT_SERVICE_PORT}"
    environment:
      DB_HOST: payment-db
      DB_PORT: 5432 # Connects to payment-db internally on 5432
      DB_USER: postgres
      DB_PASSWORD: ${PAYMENT_DB_PASSWORD}
      DB_NAME: paymentdb
      PORT: ${PAYMENT_SERVICE_PORT}
      MQ_URL: amqp://${MQ_USER:-guest}:${MQ_PASSWORD:-guest}@rabbitmq:5672/${MQ_VHOST:-}
    volumes:
      - ./payment-service:/app
    depends_on:
      payment-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:${PAYMENT_SERVICE_PORT}/health || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - payment-network

  payment-db:
    image: postgres:18.3-alpine3.23
    container_name: payment-db
    ports:
      - "${PAYMENT_DB_PORT:-5432}:5432" # Expose on port 5435 for DBeaver access
    environment:
      POSTGRES_USER: ${PAYMENT_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${PAYMENT_DB_PASSWORD}
      POSTGRES_DB: ${PAYMENT_DB_NAME:-paymentdb}
    volumes:
      - payment_db_data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${PAYMENT_DB_USER:-postgres} -d ${PAYMENT_DB_NAME:-paymentdb}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - payment-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    ports:
      - "5672:5672" # พอร์ตสำหรับเชื่อมต่อรับ-ส่งข้อมูล (AMQP)
      - "15672:15672" # พอร์ตสำหรับหน้า Dashboard (RabbitMQ Management)
    environment:
      RABBITMQ_DEFAULT_USER: ${MQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${MQ_PASSWORD:-guest}
      RABBITMQ_DEFAULT_VHOST: ${MQ_VHOST:-/}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - payment-network
      - order-network

volumes:
  user_db_data:
  order_db_data:
  payment_db_data:

networks:
  gateway-network:
    driver: bridge
  payment-network:
    driver: bridge
  order-network:
    driver: bridge
